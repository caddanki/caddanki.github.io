    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    padding: 20px;
    background-attachment: fixed;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

h1 {
    text-align: center;
    color: #667eea;
    margin-bottom: 30px;
    font-size: 2em;
}



.control-group:last-child {
    margin-bottom: 0;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
}

select, input[type="number"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s;
}

select:focus, input[type="number"]:focus {
    outline: none;
    border-color: #667eea;
}



.radio-group {
    display: flex;
    gap: 15px;
    margin-top: 8px;
}

.radio-option {
    display: flex;
    align-items: center;
    gap: 5px;
}

.radio-option input[type="radio"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.checkboxes-container {
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 8px;
    border: 2px solid #e0e0e0;
}

.checkboxes-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 12px;
    border-radius: 6px;
    transition: all 0.1s;
}

.checkbox-item.active {
    background: #667eea;
    color: white;
    transform: scale(1.1);
}

.checkbox-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

@keyframes countPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.count-in-display {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, #ffd43b 0%, #fab005 100%);
    border-radius: 15px;
    color: white;
    font-size: 72px;
    font-weight: bold;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(255, 212, 59, 0.4);
    animation: countPulse 0.5s ease;
}

.count-in-display.hidden {
    display: none !important;
}

.song-cue {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    text-align: center;
    padding: 15px 40px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    border-radius: 0 0 15px 15px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.5);
    animation: cuePulse 0.8s ease infinite;
    max-width: 80%;
}
.song-cue.hidden {
    display: none !important;
}

.song-cue .countdown {
    font-size: 20px;
    margin-top: 5px;
}

@keyframes cuePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.9; }
}



.progression-display {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.progression-display.hidden {
    display: none !important;
}

.chords-section h2 {
    color: #667eea;
    margin-bottom: 12px;
    margin-top: 5px;
    text-align: center;
    font-size: 1.1em;
    font-weight: 600;
}

.chords-section h2.hidden {
    display: none;
}

.chord-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.8);
    filter: brightness(1.1);
}

.chord-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
}

.chord-btn.playing {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    animation: chordPlay 0.4s ease;
    box-shadow: 0 0 30px rgba(240, 147, 251, 0.8);
}

@keyframes chordPlay {
    0% { 
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    50% { 
        transform: scale(1.08);
        box-shadow: 0 0 40px rgba(240, 147, 251, 1);
    }
    100% { 
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
}

/* Add particle effect overlay */
.chord-btn.playing::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
    transform: translate(-50%, -50%) scale(0);
    border-radius: 15px;
    animation: particleExpand 0.4s ease;
    pointer-events: none;
}

@keyframes particleExpand {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
    }
}

.controls-section {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.control-group {
    margin-bottom: 10px;
}

.controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 10px;
}

.controls-row-three {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin-bottom: 10px;
}

.rhythm-controls {
    display: contents;
}

.rhythm-group {
    min-width: auto;
}

.checkboxes-row {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.checkboxes-row label {
    display: inline;
    margin-bottom: 0;

    font-size: 14px;
}

.progression-container {
    margin: 0 0 15px 0;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 10px;
    position: sticky;
    top: 10px;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.beat-grid-container {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
}

.beat-grid-wrapper {
    display: inline-block;
    min-width: 100%;
}

.beat-grid {
    display: inline-grid;
    grid-auto-flow: column;
    grid-auto-columns: 60px;
    gap: 8px;
    margin-bottom: 10px;
}

.beat-box {
    aspect-ratio: 1;
    border: 3px solid #dee2e6;
    border-radius: 8px;
    background: white;
    position: relative;
    transition: all 0.2s ease;
}

.beat-box.bar-start {
    border-left: 5px solid #667eea;
}

.beat-box.active {
    background: #667eea;
    border-color: #667eea;
    transform: scale(1.1);
    box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
}

.beat-box.played {
    background: #e9ecef;
    border-color: #adb5bd;
}

.beat-box .beat-number {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 10px;
    color: #6c757d;
    font-weight: 600;
}

    color: white;
}


.chord-labels {
    display: inline-grid;
    grid-auto-flow: column;
    grid-auto-columns: 60px;
    gap: 8px;
    margin-top: 5px;
}

.cue-labels {
    display: inline-grid;
    grid-auto-flow: column;
    grid-auto-columns: 60px;
    gap: 8px;
    margin-top: 5px;
}

.cue-label-box {
    text-align: center;
    font-size: 18px;

    background: #51cf66;

    border-radius: 6px;

.chord-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

.chord-btn {
    padding: 30px;

.control-buttons {

.start-btn {
    flex: 1;

.start-btn:active {

.stop-btn {

    background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);

.stop-btn:hover {

.stop-btn:active {

.stop-btn:disabled:hover {

.wrong-chord-flash {
    animation: wrongFlash 0.5s ease;
}

@keyframes wrongFlash {
    0%, 100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    50% { background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%); }
}
@keyframes nextChordFlash {
    0%, 100% { 
        background: #ffc107;
        transform: scale(1);
    }
    50% { 
        background: #51cf66;
        transform: scale(1.1);
    }
}
//.chord-box.next 
.chord-value.flash {
    animation: nextChordFlash 0.4s ease;
}
/* Chord Selection Section */
.chord-selection-section {

}

    gap: 15px;

}

.chord-select-item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;

.ready-btn {

/* Modal Styles */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.modal.hidden {
    display: none;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
}

.modal-content h3 {
    color: #667eea;
    margin-bottom: 15px;

}

}

.pin-input:focus {

}

.modal-buttons {
    display: grid;

.modal-btn {

.confirm-btn {

.modal-btn:hover {
    transform: translateY(-2px);

}

.hidden {

}

.add-to-queue-controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 15px;
}

.queue-song-select {
    padding: 10px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 14px;
}

.queue-song-select option {
    background: #667eea;
    color: white;
}

.add-queue-btn {
    padding: 10px 20px;
    background: rgba(81, 207, 102, 0.8);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.add-queue-btn:hover {
    background: rgba(81, 207, 102, 1);
    transform: translateY(-2px);
}

.add-queue-btn:disabled {
    background: rgba(255, 255, 255, 0.2);
    cursor: not-allowed;
    transform: none;
}

.queue-list {
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 10px;
}

.queue-empty {
    text-align: center;
    padding: 20px;
    color: rgba(255, 255, 255, 0.6);
    font-style: italic;
}

.queue-item {
    background: rgba(255, 255, 255, 0.15);
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s;
}

.queue-item:hover {
    background: rgba(255, 255, 255, 0.25);
}

.queue-item-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.queue-item-number {
    background: rgba(255, 255, 255, 0.3);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    min-width: 24px;
    text-align: center;
}

.queue-item-name {
    font-weight: 500;
}

.queue-item-actions {
    display: flex;
    gap: 5px;
}

.queue-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
}

.queue-btn:hover {
    background: rgba(255, 255, 255, 0.4);
}

.remove-queue-btn {
    background: rgba(255, 107, 107, 0.6);
}

.remove-queue-btn:hover {
    background: rgba(255, 107, 107, 0.9);
}

.next-song-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #ffd43b 0%, #fab005 100%);
    border: none;
    border-radius: 8px;
    color: #333;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
}

.next-song-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 212, 59, 0.4);
}

.next-song-btn:disabled {
    background: rgba(255, 255, 255, 0.2);
    color: rgba(255, 255, 255, 0.5);
    cursor: not-allowed;
    transform: none;
}

/* Auto-Advance Controls */
.auto-advance-controls {
    margin: 15px 0;
    padding: 12px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
}

.auto-advance-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 14px;
}

.auto-advance-label input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.auto-advance-label span {
    flex: 1;
}

/* Song completion message */
.song-complete-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3000;
    background: linear-gradient(135deg, #51cf66 0%, #2f9e44 100%);
    padding: 30px 40px;
    border-radius: 15px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    animation: slideInDown 0.5s ease;
}

@keyframes slideInDown {
    from {
        transform: translate(-50%, -100%);
        opacity: 0;
    }
    to {
        transform: translate(-50%, -50%);
        opacity: 1;
    }
}

/* Sync Indicator */
.sync-indicator {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 3000;
    background: linear-gradient(135deg, #ffd43b 0%, #fab005 100%);
    padding: 12px 20px;
    border-radius: 8px;
    color: #333;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(255, 212, 59, 0.4);
    animation: slideInRight 0.3s ease;
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* Toast Notification System */
.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 4000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 350px;
}

.toast {
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideInRight 0.3s ease;
    position: relative;
    overflow: hidden;
}

.toast::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
}

.toast.success::before {
    background: #51cf66;
}

.toast.error::before {
    background: #ff6b6b;
}

.toast.info::before {
    background: #667eea;
}

.toast.warning::before {
    background: #ffd43b;
}

.toast-icon {
    font-size: 24px;
    flex-shrink: 0;
}

.toast.success .toast-icon {
    color: #51cf66;
}

.toast.error .toast-icon {
    color: #ff6b6b;
}

.toast.info .toast-icon {
    color: #667eea;
}

.toast.warning .toast-icon {
    color: #ffd43b;
}

.toast-content {
    flex: 1;
}

.toast-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 4px;
    color: #333;
}

.toast-message {
    font-size: 13px;
    color: #666;
    line-height: 1.4;
}

.toast-close {
    background: none;
    border: none;
    font-size: 20px;
    color: #999;
    cursor: pointer;
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color 0.2s;
}

.toast-close:hover {
    color: #333;
}

.toast.removing {
    animation: slideOutRight 0.3s ease forwards;
}

@keyframes slideOutRight {
    to {
        transform: translateX(120%);
        opacity: 0;
    }
}

/* Mobile responsiveness for toasts */
@media (max-width: 768px) {
    .toast-container {
        left: 20px;
        right: 20px;
        max-width: none;
    }
}

/* Song Progress Bar - Compact */
.song-progress-bar {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(102, 126, 234, 0.08);
    border-radius: 8px;
    border: 1px solid rgba(102, 126, 234, 0.15);
}

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
}

.progress-label {
    font-size: 11px;
    font-weight: 600;
    color: #667eea;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.progress-text {
    font-size: 12px;
    font-weight: bold;
    color: #495057;
}

.progress-track {
    width: 100%;
    height: 6px;
    background: #e9ecef;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s ease;
    position: relative;
}

.progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* Loading Overlay */
.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 5000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 6px solid rgba(255, 255, 255, 0.2);
    border-top-color: #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* Smooth transitions for better UX */
* {
    transition: background-color 0.2s ease, 
                color 0.2s ease, 
                border-color 0.2s ease,
                opacity 0.2s ease;
}

/* But not for transforms and positions (performance) */
*:not(.chord-btn):not(.beat-box):not(.toast) {
    transition: background-color 0.2s ease, 
                color 0.2s ease, 
                border-color 0.2s ease,
                opacity 0.2s ease;
}

/* Smooth animations for interactive elements */
button, .chord-btn, .room-btn, .start-btn, .stop-btn {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Smooth scroll behavior */
html {
    scroll-behavior: smooth;
}

/* Accessibility Improvements */

/* Focus visible for keyboard navigation */
button:focus-visible,
select:focus-visible,
input:focus-visible {
    outline: 3px solid #667eea;
    outline-offset: 2px;
}

/* Better contrast for disabled elements */
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Screen reader only content */
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
}

/* Reduce motion for users who prefer it */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* High contrast mode improvements */
@media (prefers-contrast: high) {
    .chord-btn {
        border: 3px solid white;
    }
    
    .beat-box {
        border-width: 4px;
    }
    
    .chord-label {
        border: 2px solid black;
    }
}

/* Enhanced feedback animations */

/* Pulse effect for active elements */
@keyframes activePulse {
    0%, 100% {
        box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
    }
    50% {
        box-shadow: 0 0 0 15px rgba(102, 126, 234, 0);
    }
}

.beat-box.active {
    animation: activePulse 0.6s ease-out;
}

/* Success feedback */
@keyframes successPulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(81, 207, 102, 0.8);
    }
    100% {
        transform: scale(1);
    }
}

.success-feedback {
    animation: successPulse 0.4s ease;
}

/* Error shake */
@keyframes errorShake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
}

.error-feedback {
    animation: errorShake 0.5s ease;
}

/* Selection Section Headers */
.selection-section-header {
    grid-column: 1 / -1;
    font-size: 14px;
    font-weight: bold;
    color: #667eea;
    padding: 8px 0;
    margin-top: 10px;
    border-bottom: 2px solid rgba(102, 126, 234, 0.2);
}

.selection-section-header:first-child {
    margin-top: 0;
}

// Initialize synth based on instrument
function initSynth(instrument) {
    if (synth) synth.dispose();
    if (sustainSynth) sustainSynth.dispose();
    if (reverb) reverb.dispose();
    if (chorus) chorus.dispose();
    if (compressor) compressor.dispose();

    // Create effects chain
    reverb = new Tone.Reverb({
        decay: 2.5,
        wet: 0.3
    }).toDestination();
    
    chorus = new Tone.Chorus({
        frequency: 1.5,
        delayTime: 3.5,
        depth: 0.7,
        wet: 0.3
    }).connect(reverb);
    
    compressor = new Tone.Compressor({
        threshold: -24,
        ratio: 4,
        attack: 0.003,
        release: 0.1
    }).connect(chorus);

    switch(instrument) {
        case 'guitar':
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { 
                    type: 'triangle',
                    partials: [1, 0.5, 0.3, 0.1]
                },
                envelope: { 
                    attack: 0.005, 
                    decay: 0.3, 
                    sustain: 0.4, 
                    release: 1.5 
                },
                volume: -8
            }).connect(compressor);
            
            sustainSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { 
                    type: 'triangle',
                    partials: [1, 0.5, 0.3, 0.1]
                },
                envelope: { 
                    attack: 0.005, 
                    decay: 0.1, 
                    sustain: 0.8, 
                    release: 0.8 
                },
                volume: -8
            }).connect(compressor);
            break;
            
        case 'violin':
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { 
                    type: 'sawtooth',
                    partials: [1, 0.8, 0.6, 0.4, 0.2]
                },
                envelope: { 
                    attack: 0.08, 
                    decay: 0.2, 
                    sustain: 0.7, 
                    release: 0.6 
                },
                volume: -10
            }).connect(compressor);
            
            sustainSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { 
                    type: 'sawtooth',
                    partials: [1, 0.8, 0.6, 0.4, 0.2]
                },
                envelope: { 
                    attack: 0.08, 
                    decay: 0.1, 
                    sustain: 0.9, 
                    release: 0.4 
                },
                volume: -10
            }).connect(compressor);
            break;
            
        case 'pads':
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { 
                    type: 'sine',
                    partials: [1, 0.7, 0.5, 0.3, 0.1]
                },
                envelope: { 
                    attack: 0.4, 
                    decay: 0.3, 
                    sustain: 0.8, 
                    release: 2.5 
                },
                volume: -6
            }).connect(compressor);
            
            sustainSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { 
                    type: 'sine',
                    partials: [1, 0.7, 0.5, 0.3, 0.1]
                },
                envelope: { 
                    attack: 0.3, 
                    decay: 0.2, 
                    sustain: 0.9, 
                    release: 1.5 
                },
                volume: -6
            }).connect(compressor);
            break;
    }
}

// Calculate total beats to display (entire song + 2 count-in bars)
function getTotalBeatsToDisplay() {
    if (!currentSong || !songMode) return 12;
    
    const beatsPerBar = getBeatsPerBar();
    let totalBars = 2; // Start with 2 count-in bars
    
    // Check if new bar-based format
    if (currentSong.progression && currentSong.progression[0] && currentSong.progression[0].bar !== undefined) {
        // New format - get max bar number
        const maxBar = Math.max(...currentSong.progression.map(b => b.bar || 0));
        totalBars += maxBar;
    } else {
        // Old format - count progression items
        currentSong.progression.forEach(item => {
            if (typeof item === 'object' && (item.chord || item.cue || item.note)) {
                totalBars++;
            }
        });
    }
    
    return totalBars * beatsPerBar;
}

// Get beats per bar
function getBeatsPerBar() {
    const timeSignature = document.getElementById('timeSignature').value;
    return parseInt(timeSignature.split('/')[0]);
}

    beatGrid.innerHTML = '';
    chordLabels.innerHTML = '';

    for (let i = 0; i < totalBeats; i++) {
        // Create beat box
        const beatBox = document.createElement('div');
        beatBox.className = 'beat-box';

    const beatsPerBar = getBeatsPerBar();
    const countInBeats = beatsPerBar * 2;

            chordLabel.textContent = '';

            cueLabel.textContent = '';
            cueLabel.className = 'cue-label-box empty';
        }

        progression = currentSong.flatProgression;

        // New format but not parsed yet - parse it now
        console.log('Parsing progression on-the-fly in updateBeatGrid');
        progression = parseProgression(currentSong.progression);
        currentSong.flatProgression = progression; // Cache it
    } else {
        // Old format
        progression = currentSong.progression;
    }
    
    console.log('Using progression in updateBeatGrid:', progression);
    
    progression.forEach((item, index) => {
        // Handle cues
        if (item.type === 'cue' || (typeof item === 'object' && item.cue)) {
            const cueText = item.value || item.cue;
            const bar = item.bar || Math.floor(index / beatsPerBar);
            const beat = item.beat || item.originalBeat || 1;
            
            const beatIndex = countInBeats + ((bar - 1) * beatsPerBar) + (beat - 1);
            
            if (beatIndex < totalBeats && beatIndex >= countInBeats) {
                const cueLabel = document.getElementById(`cue-label-${beatIndex}`);
                if (cueLabel) {
                    cueLabel.textContent = cueText.charAt(0);
                    cueLabel.className = 'cue-label-box';
                    cueLabel.title = cueText;
                }
            }
            return;
        }
        
        // Handle chords and notes
        if (item.type === 'chord' || item.type === 'note' || item.chord || item.note) {
            const value = item.value || item.chord || item.note;
            const bar = item.bar !== undefined ? item.bar : Math.floor(index / beatsPerBar);
            const beat = item.beat || item.originalBeat || 1;
            
            // Calculate absolute beat index
            // bar 1, beat 1 = countInBeats + 0
            // bar 1, beat 2.5 = countInBeats + 1.5
            const barOffset = (bar - 1) * beatsPerBar;
            const beatOffset = beat - 1;
            const absoluteBeatIndex = Math.floor(countInBeats + barOffset + beatOffset);
            
            if (absoluteBeatIndex < totalBeats && absoluteBeatIndex >= countInBeats) {
                const label = document.getElementById(`chord-label-${absoluteBeatIndex}`);

function highlightBeatInGrid(beatNumber) {
    //console.log('highlightBeatInGrid called with beatNumber:', beatNumber, 'currentBeatIndex:', currentBeatIndex); // ADD THIS

    const beatsPerBar = getBeatsPerBar();

    //console.log('absoluteBeatIndex:', absoluteBeatIndex, 'totalBeats:', totalBeats); // ADD THIS
    
    // Clear all active states
    for (let i = 0; i < totalBeats; i++) {
        const box = document.getElementById(`beat-box-${i}`);

            box.classList.remove('active');
        }

        if (i < absoluteBeatIndex) {
            const cueLabel = document.getElementById(`cue-label-${i}`);
            if (cueLabel && !cueLabel.classList.contains('empty')) {
                cueLabel.classList.add('passed');
            }
        }
    }
    
    // Highlight current beat
    const currentBox = document.getElementById(`beat-box-${absoluteBeatIndex}`);
    if (currentBox) {
        currentBox.classList.add('active');
        
        // Auto-scroll: keep current beat visible and centered
        const container = document.getElementById('beatGridContainer');
        const containerWidth = container.clientWidth;
        
        // Get actual dimensions (responsive)
        const firstBeatBox = document.getElementById('beat-box-0');
        const secondBeatBox = document.getElementById('beat-box-1');
        if (!firstBeatBox || !secondBeatBox) return;
        
        const beatBoxWidth = firstBeatBox.offsetWidth;
        
        // Calculate actual gap from the difference between two boxes
        const firstBoxRight = firstBeatBox.offsetLeft + firstBeatBox.offsetWidth;
        const secondBoxLeft = secondBeatBox.offsetLeft;
        const beatBoxGap = secondBoxLeft - firstBoxRight;
        
        const totalBeatWidth = beatBoxWidth + beatBoxGap;
        
        // Calculate the position of the current beat box
        const beatPosition = absoluteBeatIndex * totalBeatWidth;
        
        // Calculate how much we should offset to center the beat
        const centerOffset = containerWidth / 2 - (beatBoxWidth / 2);
        
        // Target scroll position (beat in center of viewport)
        const targetScroll = beatPosition - centerOffset;
        
        // Only scroll if we're past the first bar
        if (absoluteBeatIndex >= beatsPerBar) {
            // Clamp scroll to valid range
            const maxScroll = container.scrollWidth - containerWidth;
            const clampedScroll = Math.max(0, Math.min(targetScroll, maxScroll));
            
            // Smooth scroll
            container.scrollTo({
                left: clampedScroll,
                behavior: 'smooth'
            });
        } else {
            // First bar - no scroll
            container.scrollLeft = 0;
        }
    }
	
	// Update song progress indicator
	if (songMode && currentSong) {
		const beatsPerBar = getBeatsPerBar();
		const currentBar = Math.floor(absoluteBeatIndex / beatsPerBar);
		const totalBars = Math.floor(totalBeats / beatsPerBar);
		
		// Update progress text
		const progressText = document.getElementById('progressText');
		if (progressText) {
			progressText.textContent = `Bar ${currentBar} / ${totalBars}`;
		}
		
		// Update progress bar
		const progressFill = document.getElementById('progressFill');
		if (progressFill) {
			const progressPercent = (absoluteBeatIndex / totalBeats) * 100;
			progressFill.style.width = `${Math.min(progressPercent, 100)}%`;
		}
	}
}

// Load song from backend
async function loadSong(songKey) {
    if (!songKey) {
        currentSong = null;
        songMode = false;
        progressionIndex = 0;
        selectedChords = [];
        isChordSelectionMode = false;
        document.getElementById('chordSelectionSection').style.display = 'none';
        document.getElementById('progressionDisplay').classList.add('hidden');
        return;
    }
    
    try {
        // Fetch full song data from backend
        const response = await fetch(`${BACKEND_URL}/api/songs/${songKey}`);
        const data = await response.json();
        
        if (data.success) {
            currentSong = data.song;
            
            // Parse new bar-based format if present
            if (currentSong.progression && currentSong.progression.length > 0) {
                if (currentSong.progression[0].bar !== undefined) {
                    // New format - parse it
                    currentSong.flatProgression = parseProgression(currentSong.progression);
                } else {
                    // Old format - use as is
                    currentSong.flatProgression = currentSong.progression;
                }
            }
            
            songMode = true;
            progressionIndex = 0;
            selectedChords = [];
            
            console.log('Loaded song from backend:', currentSong);
            
            // Update UI with song data
            document.getElementById('bpm').value = currentSong.bpm;
            document.getElementById('timeSignature').value = currentSong.timeSignature;
            
            // If user is host in a room, broadcast song selection
            if (myRole === 'host' && socket && socket.connected && currentRoomId) {
                socket.emit('select_song', { songId: songKey });
                console.log('Host selected song, broadcasting to room');
                document.getElementById('currentSongName').textContent = currentSong.name;

            }
            
            // Show chord selection UI
            showChordSelection(currentSong.chords, currentSong.notes);
            
            // Hide progression display until ready
            document.getElementById('progressionDisplay').classList.add('hidden');
            
        } else {
            showToast('Failed to load song from server', 'error', 'Load Error');
        }
        
    } catch (error) {
        console.error('Error loading song:', error);
        showToast('Failed to load song from server', 'error', 'Connection Error');
    }
}

// Parse new bar-based progression format
function parseProgression(progression) {
    const flatProgression = [];
    
    progression.forEach(barData => {
        if (!barData.events) {
            // Old format - keep for backward compatibility
            flatProgression.push(barData);
            return;
        }
        
        // New format - flatten bar.events into beat positions
        barData.events.forEach(event => {
            flatProgression.push({
                ...event,
                bar: barData.bar,
                originalBeat: event.beat  // Keep for reference
            });
        });
    });
    
    return flatProgression;
}

    if (e.target.checked) {

            selectedChords.push(selectionKey);
            item.classList.add('selected');

            e.target.checked = false;
            showToast('Maximum 8 chords/notes', 'warning', 'Selection Limit');
        }
    } else {
        selectedChords = selectedChords.filter(c => c !== selectionKey);
        item.classList.remove('selected');
    }
    
    updateReadyButton();

function moveQueueItem(index, direction) {
    const newQueue = [...songQueue];
    
    if (direction === 'up' && index > 0) {
        [newQueue[index - 1], newQueue[index]] = [newQueue[index], newQueue[index - 1]];
    } else if (direction === 'down' && index < newQueue.length - 1) {
        [newQueue[index], newQueue[index + 1]] = [newQueue[index + 1], newQueue[index]];
    } else {
        return;
    }
    
    if (socket && socket.connected && currentRoomId) {
        socket.emit('reorder_queue', { newQueue });
        console.log('Reordering queue:', newQueue);
    }
}

// Skip to next song in queue
function skipToNextSong() {
    if (songQueue.length === 0) {
        showToast('No songs in queue', 'warning', 'Queue Empty');
        return;
    }
    
    if (confirm('Skip to next song? Current song will stop.')) {
        if (socket && socket.connected && currentRoomId) {
            socket.emit('next_song');
            console.log('Skipping to next song');
        }
    }
}

// Show song complete message
function showSongCompleteMessage(message) {
    // Remove any existing message
    const existing = document.querySelector('.song-complete-message');
    if (existing) {
        existing.remove();
    }
    
    // Create message element
    const messageEl = document.createElement('div');
    messageEl.className = 'song-complete-message';
    messageEl.innerHTML = message;
    document.body.appendChild(messageEl);
    
    // Auto-remove after 3 seconds
    setTimeout(() => {
        messageEl.style.transition = 'opacity 0.5s';
        messageEl.style.opacity = '0';
        setTimeout(() => messageEl.remove(), 500);
    }, 3000);
}

// Show sync indicator

// Toast notification system
function showToast(message, type = 'info', title = '', duration = 4000) {
    const container = document.getElementById('toastContainer');
    
    // Create toast element
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    // Icon based on type
    const icons = {
        success: '✓',
        error: '✕',
        info: 'ℹ',
        warning: '⚠'
    };
    
    const icon = icons[type] || icons.info;
    
    // Auto-generate title if not provided
    if (!title) {
        const titles = {
            success: 'Success',
            error: 'Error',
            info: 'Info',
            warning: 'Warning'
        };
        title = titles[type] || 'Notification';
    }
    
    toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-content">
            <div class="toast-title">${title}</div>
            <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
    `;
    
    container.appendChild(toast);
    
    // Auto-remove after duration
    if (duration > 0) {
        setTimeout(() => {
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }
    
    return toast;
}

// Connect to backend via Socket.io
function connectToBackend() {
    if (socket && socket.connected) {
        console.log('Already connected to backend');
        return;
    }
    
    socket = io(BACKEND_URL, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000
    });
    
    // Connection established
    socket.on('connect', () => {
        console.log('Connected to backend:', socket.id);
    });
    
    // Connection error
    socket.on('connect_error', (error) => {
        console.error('Connection error:', error);
        alert('Failed to connect to server. Please try again.');
    });
    
    // Disconnected
    socket.on('disconnect', (reason) => {
        console.log('Disconnected from backend:', reason);
        if (reason === 'io server disconnect') {
            // Server disconnected us, try to reconnect
            socket.connect();
        }
    });
    
    // Setup event listeners
    setupSocketListeners();
}

        if (isPlaying) {

    socket.on('auto_advance_toggled', (data) => {

        autoAdvanceEnabled = data.autoAdvance;
        
        // Update checkbox if it exists
        const checkbox = document.getElementById('autoAdvanceCheckbox');
        if (checkbox) {

        }
    });
    
    // Song end reached (no auto-advance or queue empty)
    socket.on('song_end_reached', (data) => {

        showSongCompleteMessage('Song Complete! 🎉');
    });

    socket.on('user_chords_updated', (data) => {
        console.log('User chords updated:', data);
        // Update UI if needed
    });
    
    // Playback started (synchronized)
    socket.on('playback_started', (data) => {
        console.log('Playback started:', data);
        
        if (myRole === 'guest') {
            // Guest receives synchronized playback command
            const { songId, bpm, startTimestamp } = data;
            
            // Make sure the song is loaded and beat grid is ready
            if (!currentSong || !songMode) {
                console.error('Guest: Song not loaded properly');
                return;
            }
            
            // Ensure beat grid is displayed
            const display = document.getElementById('progressionDisplay');
            if (display.classList.contains('hidden')) {
                displayProgression();
            }
            
            // Calculate delay until start time
            const now = Date.now();
            const delay = startTimestamp - now;
            
            console.log(`Sync: Starting in ${delay}ms at timestamp ${startTimestamp}`);
            
            if (delay > 0) {
                // Wait until the exact start time, then begin
                setTimeout(() => {
                    startCountInSynced(bpm);
                }, delay);
            } else {
                // We're late, start immediately
                console.warn('Late to the party, starting immediately');
                startCountInSynced(bpm);
            }
        }
    });
    
    // Playback stopped
    socket.on('playback_stopped', (data) => {
        console.log('Playback stopped');
        
        if (myRole === 'guest') {
            stopMetronome();
            alert('Host stopped playback');
        }
    });
	
	// Beat sync from host (for drift correction)
    socket.on('beat_sync', (data) => {
        if (myRole !== 'guest' || !isPlaying) return;
        
		// ADD THIS - Prevent correction spam
        const nowDrift = Date.now();
        const timeSinceLastCorrection = nowDrift - lastSyncTime;
        
        if (timeSinceLastCorrection < 2000) {
            console.log('Skipping sync - too soon since last correction');
            return;
        }
		
        const { beat, bar, timestamp, bpm, serverTimestamp, progressionIndex: hostProgressionIndex } = data;
        
        console.log('=== SYNC HEARTBEAT RECEIVED ===');
        console.log('Host at: Bar', bar, 'Beat', beat);
        console.log('Host progressionIndex:', hostProgressionIndex);
        
        // Calculate expected position based on when sync was sent
        const now = Date.now();
        const networkLatency = now - timestamp;
        const timeSinceSync = now - serverTimestamp;
        
        console.log('Network latency:', networkLatency, 'ms');
        console.log('Time since sync:', timeSinceSync, 'ms');
        
        // Calculate where guest should be
        const beatDuration = (60 / bpm) * 1000; // ms per beat
        const beatsPerBar = parseInt(document.getElementById('timeSignature').value.split('/')[0]);
        const division = parseInt(document.querySelector('input[name="division"]:checked').value);
        const noteDuration = (60 / bpm) * (beatsPerBar / division);
        
        const expectedBeatsSinceSync = timeSinceSync / (noteDuration * 1000);
        const hostTotalBeats = (bar * division) + ((beat - 1) * (division / beatsPerBar));
		const expectedCurrentBeatIndex = hostProgressionIndex - 1; //sync is sent after host increments
        //const expectedCurrentBeatIndex = Math.floor(hostTotalBeats + expectedBeatsSinceSync);
        
        console.log('Guest currentBeatIndex:', currentBeatIndex);
        console.log('Expected currentBeatIndex:', expectedCurrentBeatIndex);
        
        // Calculate drift
        const beatDrift = currentBeatIndex - expectedCurrentBeatIndex;
        syncDriftMs = beatDrift * (noteDuration * 1000);
        
        console.log('Drift:', beatDrift, 'beats =', syncDriftMs.toFixed(2), 'ms');
        
        // Auto-correct based on drift magnitude
        const GRADUAL_THRESHOLD_MS = 150;  // Use gradual correction
        const HARD_RESYNC_THRESHOLD_MS = 500; // Force resync
        
        if (Math.abs(syncDriftMs) > HARD_RESYNC_THRESHOLD_MS) {
            // Large drift - hard resync
            console.log('⚠️ LARGE DRIFT - HARD RESYNC:', syncDriftMs.toFixed(2), 'ms');
            
            const wasPlaying = isPlaying;
            
            if (wasPlaying) {
                isScheduling = false;
                
                setTimeout(() => {
                    currentBeatIndex = expectedCurrentBeatIndex;
                    console.log('Hard resynced to beat:', currentBeatIndex);
                    
                    nextBeatTime = Tone.now();
                    isScheduling = true;
                    scheduleMetronome();
                    
                    syncCorrectionCount++;
                    showSyncIndicator('Resynced!');
                }, 100);
            }
            
        } else if (Math.abs(syncDriftMs) > GRADUAL_THRESHOLD_MS) {
            // Medium drift - gradual correction
            console.log('⚠️ DRIFT DETECTED - GRADUAL CORRECTION:', syncDriftMs.toFixed(2), 'ms');
            
            const correctionFactor = 0.5;
            const correctionSeconds = (syncDriftMs / 1000) * correctionFactor;
            
            const now = Tone.now();
            const timeUntilNextBeat = nextBeatTime - now;
            
            if (timeUntilNextBeat > 0.05) {
                nextBeatTime -= correctionSeconds;
                console.log('Gradual correction applied:', correctionSeconds.toFixed(3), 's');
                
                syncCorrectionCount++;
                showSyncIndicator('Adjusting...');
            } else {
                console.log('Too close to next beat, skipping correction');
            }
            
        } else {
            console.log('✓ Sync good (drift:', syncDriftMs.toFixed(2), 'ms)');
        }
        
        // Update progression index if significantly different
        if (Math.abs(progressionIndex - hostProgressionIndex) > 2 && songMode) {
            console.log('Updating progressionIndex from', progressionIndex, 'to', hostProgressionIndex);
            progressionIndex = hostProgressionIndex;
            
            // Update beat grid
            if (selectedChords.length > 0) {
                updateBeatGridPersonalized();
            } else {
                updateBeatGrid();
            }
        }
        
        lastSyncTime = now;
    });
    
    // Beat update (sync from host)
    socket.on('beat_update', (data) => {
        // Guests receive beat updates to stay in sync
        // This will be used for tight synchronization
    });
    
    // Room closed
    socket.on('room_closed', (data) => {
        showToast(data.message, 'warning', 'Room Closed', 6000);
        leaveRoom();
    });
    
    // Error from server
    socket.on('error', (data) => {
        console.error('Server error:', data);
        alert('Error: ' + data.message);
    });
}

// Create a new room (Host)
async function createRoom() {
    try {
		showLoading('Creating room...');
        myUserId = generateUserId();
        myRole = 'host';
        
        const response = await fetch(`${BACKEND_URL}/api/room/create`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ hostId: myUserId })
        });
        
        const data = await response.json();
        
        if (data.success) {
            currentRoomId = data.roomId;
            currentRoomPin = data.pin;
            
            console.log('Room created:', data);
            
            // Connect to backend and join room via WebSocket
            connectToBackend();
            
            // Wait for socket to connect, then join room
            setTimeout(() => {
                socket.emit('join_room', {
                    roomId: currentRoomId,
                    userId: myUserId,
                    role: 'host'
                });
				hideLoading(); // ADD THIS

            }, 500);
            
        } else {
            showToast(data.error || 'Unknown error', 'error', 'Failed to Create Room');
        }
        
    } catch (error) {
        console.error('Error creating room:', error);
		hideLoading();
		showToast('Failed to create room. Please try again.', 'error', 'Connection Error');
    }
}

        if (data.success) {

                    roomId: currentRoomId,

// Leave room

    if (socket && currentRoomId) {
        socket.emit('leave_room');
    }
    
    // Reset state
    currentRoomId = null;
    currentRoomPin = null;
    myRole = null;
    connectedUsers = [];
    
    // Disconnect socket
    if (socket) {
        socket.disconnect();
        socket = null;
    }
    
    // Reset UI
    hideRoomInfo();
    document.getElementById('roomControls').style.display = 'grid';
}

// Check and show cue
function checkAndShowCue() {
    if (!songMode || !currentSong) return;
    
    // Use flatProgression
    const progression = currentSong.flatProgression || currentSong.progression;
    
    if (progressionIndex >= progression.length) return;
    
    const item = progression[progressionIndex];
    
    if (item.type === 'cue' || (typeof item === 'object' && item.cue)) {
        progressionIndex++;
        displayProgression();
    }
}

function advanceProgression() {
    //console.log('advanceProgression called - progressionIndex:', progressionIndex, 'songMode:', songMode, 'currentSong exists:', !!currentSong);
    
    if (!songMode || !currentSong) {
        //console.log('Exiting advanceProgression - no song mode or no current song');
        return;
    }
    
    progressionIndex++;
    
    // Use flatProgression if available
    const progression = currentSong.flatProgression || currentSong.progression;
    
    //console.log('Incremented progressionIndex to:', progressionIndex, 'Total progression length:', progression.length);
    
    if (progressionIndex >= progression.length) {
        console.log('=== SONG COMPLETE (via chord progression) ===');
        displayProgression();
        
        if (myRole === 'host' && socket && socket.connected && currentRoomId && isScheduling) {
            console.log('HOST: Sending song_completed event (progression-based)');
            socket.emit('song_completed');
            isScheduling = false;
        }
        
        return;
    }
    
    //console.log('Song not complete yet, continuing...');
    
    checkAndShowCue();
    
    if (selectedChords.length > 0) {
        updateBeatGridPersonalized();
    } else {
        updateBeatGrid();
    }
}

// Check song chord
function checkSongChord(playedValue) {
    //console.log('checkSongChord called with:', playedValue, 'songMode:', songMode, 'progressionIndex:', progressionIndex);
    
    if (!songMode || !currentSong) {
        //console.log('checkSongChord: not in song mode or no song');
        return true;
    }
    
    // Use flatProgression
    const progression = currentSong.flatProgression || currentSong.progression;
    
    if (progressionIndex >= progression.length) {
        //console.log('checkSongChord: progression already complete');
        return false;
    }
    
    const expectedItem = progression[progressionIndex];
    
    if (expectedItem.type === 'cue' || (typeof expectedItem === 'object' && expectedItem.cue)) {
        //console.log('checkSongChord: current item is a cue, returning false');
        return false;
    }
    
    // Extract the type and value from playedValue (format: "chord:E" or "note:E3")
    const [playedType, playedName] = playedValue.includes(':') 
        ? playedValue.split(':') 
        : ['chord', playedValue]; // Backward compatibility
    
    //console.log('Played type:', playedType, 'Played name:', playedName);
    
    // Check if what user played matches any item in this progression position
    let isCorrect = false;
    
    // New format
    if (expectedItem.type === playedType && expectedItem.value === playedName) {
        isCorrect = true;
    }
    
    // Old format backward compatibility
    if (playedType === 'chord' && expectedItem.chord === playedName) {
        isCorrect = true;
    }
    if (playedType === 'note' && expectedItem.note === playedName) {
        isCorrect = true;
    }
    if (playedType === 'note' && expectedItem.melody === playedName) {
        isCorrect = true;
    }
    
    //console.log('Is correct:', isCorrect);
    
    // Always advance (even if wrong)
    advanceProgression();
    
    return isCorrect;
}

function startSustain(chordName, itemDuration) {
    const sustainMode = document.getElementById('sustainMode').checked;
    if (!sustainMode) return;
    
    // Stop any previous sustained chord
    if (sustainedChord) {
        const notes = chordDefinitions[sustainedChord];
        sustainSynth.triggerRelease(notes);
        
        // Clear any pending auto-release
        if (sustainReleaseTimeout) {
            clearTimeout(sustainReleaseTimeout);
            sustainReleaseTimeout = null;
        }
    }
    
    sustainedChord = chordName;
    let button = document.querySelector(`[data-chord="${chordName}"]`);
    if (button) button.classList.add('playing');
    
    // Play with attack
    const notes = chordDefinitions[chordName];
    sustainSynth.triggerAttack(notes, Tone.now());
    
    // Auto-release after duration if specified
    if (itemDuration && itemDuration > 0) {
        const bpm = parseInt(document.getElementById('bpm').value);
        const beatDuration = 60 / bpm;
        const releaseDuration = itemDuration * beatDuration * 1000; // Convert to ms
        
        //console.log('Auto-release scheduled in', releaseDuration, 'ms');
        
        sustainReleaseTimeout = setTimeout(() => {
            if (sustainedChord === chordName) {
                stopSustain(chordName);
            }
        }, releaseDuration);
    }
}

function stopSustain(chordName) {
	const sustainMode = document.getElementById('sustainMode').checked;
    if (!sustainMode) return;
    
    // Clear auto-release timeout
    if (sustainReleaseTimeout) {
        clearTimeout(sustainReleaseTimeout);
        sustainReleaseTimeout = null;
    }
    
    // Only release if this is the currently sustained chord
    if (sustainedChord === chordName) {
        let button = document.querySelector(`[data-chord="chord:${chordName}"]`);
        if (button) {
				button.classList.remove('playing');
		}
		else {
			button = document.querySelector(`[data-chord="${chordName}"]`);
			if (button) button.classList.remove('playing');
		}
        
        // Release the notes
        const notes = chordDefinitions[chordName];
        sustainSynth.triggerRelease(notes, Tone.now());
        
        sustainedChord = null;
    }
}

// Precise scheduling function using Tone.js timing
function scheduleMetronome() {
    if (!isScheduling) {
        //console.log('scheduleMetronome called but isScheduling is false, returning');
        return;
    }
    
    // ADD THIS CHECK
    if (currentBeatIndex === 0 && nextBeatTime > Tone.now() + 1.0) {
        //console.log('FIXING: nextBeatTime is too far in future, resetting to now');
        nextBeatTime = Tone.now();
    }
    
    //console.log('scheduleMetronome running - currentBeatIndex:', currentBeatIndex, 'isPlaying:', isPlaying);
	
    const bpm = parseInt(document.getElementById('bpm').value);
    const timeSignature = document.getElementById('timeSignature').value;
    const division = parseInt(document.querySelector('input[name="division"]:checked').value);
    const beatsPerBar = parseInt(timeSignature.split('/')[0]);
    const beatDuration = 60 / bpm;
    const noteDuration = (beatsPerBar / division) * beatDuration;
    const quarterNoteDuration = 60 / bpm;
    const repeatMode = document.getElementById('repeatMode').checked;
    
    const now = Tone.now();
    const lookAhead = 0.1;
    //added this line
	//console.log('NextBeatTime: ', nextBeatTime, ' Now: ', now, 'Look Ahead: ', lookAhead);
	
    while (nextBeatTime < now + lookAhead) {
        const beatIndex = currentBeatIndex;
        const beatTime = nextBeatTime;
        
        // Calculate which beat within the bar for the checkbox highlighting
        const beatInBar = currentBeatIndex % division;
        
        const visualOffset = 0.05;
        Tone.Draw.schedule(() => {
            //console.log('Visual update - beatInBar:', beatInBar, 'beatIndex:', beatIndex); // ADD THIS

            updateMetronome(beatInBar);  // Use beatInBar for checkbox highlighting
            
            // Highlight beat in grid using absolute position
            //console.log('Calling highlightBeatInGrid with:', beatIndex); // ADD THIS
	
            highlightBeatInGrid(beatIndex);
            
            const currentQuarterBeat = Math.floor((beatIndex * noteDuration) / quarterNoteDuration);
            const prevQuarterBeat = beatIndex === 0 ? -1 : Math.floor(((beatIndex - 1) * noteDuration) / quarterNoteDuration);
            
            if (cueCountdown > 0 && currentQuarterBeat !== prevQuarterBeat) {
                updateCueCountdown();
            }
        }, beatTime - visualOffset);
        
        const checkboxes = document.querySelectorAll('.checkboxes-grid input[type="checkbox"]');
		const shouldPlay = currentChord && checkboxes[beatInBar] && checkboxes[beatInBar].checked;
		const immediateMode = document.getElementById('immediateMode').checked;

		// Only play from metronome if NOT in immediate mode
		if (shouldPlay && !immediateMode) {
			if (repeatMode || beatsPlayedInBar < division) {
				const notes = chordDefinitions[currentChord];
				const playDuration = noteDuration * 0.9;
				synth.triggerAttackRelease(notes, playDuration, beatTime);
			}
		}

		nextBeatTime += noteDuration;
		currentBeatIndex++;
        //console.log('Incremented currentBeatIndex to:', currentBeatIndex, 'nextBeatTime:', nextBeatTime); // ADD THIS
		// ADD THIS BLOCK - Host sends sync heartbeat every 4 bars
        if (myRole === 'host' && socket && socket.connected && currentRoomId) {
            const beatsPerBar = parseInt(document.getElementById('timeSignature').value.split('/')[0]);
            const division = parseInt(document.querySelector('input[name="division"]:checked').value);
            
            // Calculate current bar and beat within bar
            const totalQuarterBeats = Math.floor((currentBeatIndex * noteDuration) / (60 / bpm));
            const currentBar = Math.floor(totalQuarterBeats / beatsPerBar);
            const currentBeat = (totalQuarterBeats % beatsPerBar) + 1;
            
            // Send heartbeat every 4 bars (on bar 0, 4, 8, 12, etc.)
            if (currentBar % 4 === 0 && currentBeat === 1) {
                const syncData = {
                    beat: currentBeat,
                    bar: currentBar,
                    timestamp: Date.now(),
                    bpm: bpm,
                    progressionIndex: currentBeatIndex
                };
                
                socket.emit('beat_update', syncData);
                console.log('Host sent sync heartbeat:', syncData);
            }
        }
		
		// ADD THIS BLOCK - Check if we've reached the end of the song
        if (songMode && currentSong) {
            const totalBeats = getTotalBeatsToDisplay();
            console.log('Beat check - currentBeatIndex:', currentBeatIndex, 'totalBeats:', totalBeats, 'Time: ', Date.now());
            
            // Check if we've reached the last beat of the song
            if (currentBeatIndex >= totalBeats - 1) {
                console.log('=== REACHED END OF SONG (by beat position) ===');
                
                // Send completion event (only once)
                if (myRole === 'host' && socket && socket.connected && currentRoomId) {
                    console.log('HOST: Sending song_completed event (beat-based)');
                    socket.emit('song_completed');
                    
                    // Prevent sending multiple times by stopping scheduling
                    isScheduling = false;
                    console.log('Stopped scheduling to prevent duplicate events');
                }
            }
        }

		if (currentChord && !immediateMode) {
			beatsPlayedInBar++;
		}
        
        // Check if we've completed a bar
		// Check if we've completed a bar
		if (beatInBar === division - 1) {
			// In song mode with immediate response, don't auto-clear the chord
			const immediateMode = document.getElementById('immediateMode').checked;
			
			// Clear chord after one bar in immediate mode without repeat
			if (immediateMode && !repeatMode && currentChord) {
				const barsPlayed = Math.floor(beatsPlayedInBar / division);
				if (barsPlayed >= 1) {
					Tone.Draw.schedule(() => {
						currentChord = null;
						//updateChordDisplay(null);
						beatsPlayedInBar = 0;
					}, beatTime);
				}
			}
			
			if (!repeatMode && !songMode && !immediateMode && beatsPlayedInBar >= division) {
				Tone.Draw.schedule(() => {
					currentChord = null;
					//updateChordDisplay(null);
				}, beatTime);
			}
			
			// Only switch to nextChord if it was explicitly set (not in song mode with immediate)
			if (nextChord && !immediateMode) {
				currentChord = nextChord;
				nextChord = null;
				beatsPlayedInBar = 0;
				Tone.Draw.schedule(() => {
					//updateChordDisplay(currentChord);
				}, beatTime);
			}
		}
    }
    
    requestAnimationFrame(scheduleMetronome);
}

        socket.emit('update_instrument', {
            userId: myUserId,
            instrument: instrument
        });
        console.log('Sent instrument change to backend:', instrument);
    }
});

document.querySelectorAll('input[name="division"]').forEach(radio => {
    radio.addEventListener('change', () => {
        updateCheckboxes();
        if (isPlaying) {
            startMetronome();
        }
    });
});

document.getElementById('bpm').addEventListener('change', () => {
    if (isPlaying) {
        startMetronome();
    }
});

document.getElementById('timeSignature').addEventListener('change', () => {
    if (isPlaying) {
        startMetronome();
    }
});

document.querySelectorAll('.chord-btn').forEach(btn => {
    btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleChordClick(btn.dataset.chord);
    });
    
    btn.addEventListener('mouseup', (e) => {
        e.preventDefault();
        stopSustain(btn.dataset.chord);
    });
    
    btn.addEventListener('mouseleave', (e) => {
        stopSustain(btn.dataset.chord);
    });
    
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleChordClick(btn.dataset.chord);
    });
    
    btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        stopSustain(btn.dataset.chord);
    });
    
    btn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        stopSustain(btn.dataset.chord);
    });
});

document.getElementById('startBtn').addEventListener('click', async () => {
    await Tone.start();
    
    // If host in a room, broadcast synchronized start
    if (myRole === 'host' && socket && socket.connected && currentRoomId) {
        const bpm = parseInt(document.getElementById('bpm').value);
        const songId = document.getElementById('songSelect').value;
        
        // Calculate start time: 2 seconds from now for network buffer
        const startTimestamp = Date.now() + 2000;
        
        console.log('Host broadcasting playback start at timestamp:', startTimestamp);
        
        // Broadcast to all guests
        socket.emit('start_playback', {
            songId: songId,
            bpm: bpm,
            startTimestamp: startTimestamp
        });
        
        // Host also waits for the same timestamp
        setTimeout(() => {
            startCountIn();
        }, 2000);
        
    } else {
        // Single player or guest mode
        startCountIn();
    }
});

document.getElementById('stopBtn').addEventListener('click', () => {
    // If host in a room, broadcast stop to all
    if (myRole === 'host' && socket && socket.connected && currentRoomId) {
        socket.emit('stop_playback');
        console.log('Host broadcasting playback stop');
    }
    
    stopMetronome();
});

document.getElementById('readyBtn').addEventListener('click', () => {
    confirmChordSelection();
    displayProgression();
});

// ============================================
// MULTI-USER UI EVENT LISTENERS
// ============================================

// Create Room button
document.getElementById('createRoomBtn').addEventListener('click', () => {
    createRoom();
});

// Join Room button
document.getElementById('joinRoomBtn').addEventListener('click', () => {
    // Show modal
    document.getElementById('joinRoomModal').classList.remove('hidden');
    document.getElementById('joinPinInput').value = '';
    document.getElementById('joinPinInput').focus();
});

// Cancel join button
document.getElementById('cancelJoinBtn').addEventListener('click', () => {
    document.getElementById('joinRoomModal').classList.add('hidden');
});

// Confirm join button
document.getElementById('confirmJoinBtn').addEventListener('click', () => {
    const pin = document.getElementById('joinPinInput').value.trim();
    
    if (pin.length !== 6) {
        alert('Please enter a valid 6-digit PIN');
        return;
    }
    
    document.getElementById('joinRoomModal').classList.add('hidden');
    joinRoom(pin);
});

// Allow Enter key in PIN input
document.getElementById('joinPinInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('confirmJoinBtn').click();
    }
});

// Copy PIN button
document.getElementById('copyPinBtn').addEventListener('click', () => {
    const pin = document.getElementById('pinCode').textContent;
    
    navigator.clipboard.writeText(pin).then(() => {
        const btn = document.getElementById('copyPinBtn');
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(() => {
            btn.textContent = originalText;
        }, 2000);
    }).catch(err => {
        console.error('Failed to copy:', err);
        alert('PIN: ' + pin);
    });
});

// Add to Queue button
document.getElementById('addToQueueBtn').addEventListener('click', () => {
    addToQueue();
});

// Next Song button
document.getElementById('nextSongBtn').addEventListener('click', () => {
    skipToNextSong();
});

// Queue song select - enable/disable add button
document.getElementById('queueSongSelect').addEventListener('change', (e) => {
    const addBtn = document.getElementById('addToQueueBtn');
    addBtn.disabled = !e.target.value;
});

// Leave Room button
document.getElementById('leaveRoomBtn').addEventListener('click', () => {
    if (confirm('Are you sure you want to leave the room?')) {
        leaveRoom();
    }
});
// Auto-advance checkbox toggle
document.getElementById('autoAdvanceCheckbox').addEventListener('change', (e) => {
    const enabled = e.target.checked;
    autoAdvanceEnabled = enabled;
    
    if (socket && socket.connected && currentRoomId && myRole === 'host') {
        socket.emit('toggle_auto_advance', { enabled });
        console.log('Host toggled auto-advance:', enabled);
    }
});

// Initialize
initSynth('guitar');
updateCheckboxes();

// Fetch songs from backend on page load
fetchSongsFromBackend();

createBeatGrid();
